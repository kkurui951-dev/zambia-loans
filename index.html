<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Replicate Momo Zambia - Instant Loans</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #1a7a4c; --primary-dark: #0d5c34; --primary-light: #e8f5ee;
            --danger: #e74c3c; --success: #27ae60;
            --text: #2c3e50; --text-light: #7f8c8d; --bg: #f8fafb; --white: #ffffff;
            --shadow: 0 4px 20px rgba(0,0,0,0.08); --radius: 16px; --radius-sm: 10px;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
        .header { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); padding: 20px 16px; text-align: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 20px rgba(26,122,76,0.3); }
        .header .logo { display: flex; align-items: center; justify-content: center; gap: 10px; }
        .header .logo-icon { width: 42px; height: 42px; background: var(--white); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; }
        .header h1 { color: var(--white); font-size: 18px; font-weight: 700; }
        .header .subtitle { color: rgba(255,255,255,0.8); font-size: 12px; margin-top: 2px; }
        .progress-container { background: var(--white); padding: 16px 24px 12px; box-shadow: var(--shadow); }
        .progress-steps { display: flex; align-items: center; justify-content: space-between; position: relative; }
        .progress-steps::before { content: ''; position: absolute; top: 16px; left: 30px; right: 30px; height: 3px; background: #e0e0e0; z-index: 0; }
        .progress-line { position: absolute; top: 16px; left: 30px; height: 3px; background: var(--primary); z-index: 1; transition: width 0.5s ease; width: 0%; }
        .step { display: flex; flex-direction: column; align-items: center; gap: 6px; z-index: 2; }
        .step-circle { width: 34px; height: 34px; border-radius: 50%; background: #e0e0e0; color: var(--text-light); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; transition: all 0.4s ease; }
        .step.active .step-circle { background: var(--primary); color: var(--white); transform: scale(1.1); box-shadow: 0 4px 12px rgba(26,122,76,0.4); }
        .step.completed .step-circle { background: var(--success); color: var(--white); }
        .step-label { font-size: 10px; color: var(--text-light); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .step.active .step-label { color: var(--primary); }
        .container { max-width: 480px; margin: 0 auto; padding: 20px 16px 100px; }
        .page { display: none; animation: slideIn 0.4s ease; }
        .page.active { display: block; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: translateX(0); } }
        .card { background: var(--white); border-radius: var(--radius); padding: 24px 20px; box-shadow: var(--shadow); margin-bottom: 16px; }
        .card-title { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
        .card-subtitle { font-size: 13px; color: var(--text-light); margin-bottom: 24px; line-height: 1.5; }
        .hero-banner { background: linear-gradient(135deg, var(--primary), #2d9d6a); border-radius: var(--radius); padding: 28px 24px; margin-bottom: 20px; color: var(--white); position: relative; overflow: hidden; }
        .hero-banner::after { content: ''; position: absolute; top: -50%; right: -30%; width: 200px; height: 200px; background: rgba(255,255,255,0.1); border-radius: 50%; }
        .hero-banner h2 { font-size: 22px; font-weight: 800; margin-bottom: 8px; position: relative; z-index: 1; }
        .hero-banner p { font-size: 14px; opacity: 0.9; line-height: 1.5; position: relative; z-index: 1; }
        .hero-features { display: flex; gap: 12px; margin-top: 16px; position: relative; z-index: 1; flex-wrap: wrap; }
        .hero-feature { background: rgba(255,255,255,0.15); backdrop-filter: blur(10px); border-radius: var(--radius-sm); padding: 10px 14px; font-size: 11px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
        .form-group { margin-bottom: 18px; }
        .form-label { display: block; font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 8px; }
        .form-label .required { color: var(--danger); }
        .form-input { width: 100%; padding: 14px 16px; border: 2px solid #e8ecf0; border-radius: var(--radius-sm); font-size: 15px; font-family: inherit; color: var(--text); background: var(--bg); transition: all 0.3s ease; outline: none; }
        .form-input:focus { border-color: var(--primary); background: var(--white); box-shadow: 0 0 0 4px rgba(26,122,76,0.1); }
        .form-input::placeholder { color: #b0b8c1; }
        .form-input.error { border-color: var(--danger); }
        .error-message { font-size: 12px; color: var(--danger); margin-top: 6px; display: none; }
        .error-message.show { display: block; }
        .phone-input-wrapper { display: flex; }
        .phone-prefix { padding: 14px 12px; background: var(--primary-light); border: 2px solid var(--primary); border-right: none; border-radius: var(--radius-sm) 0 0 var(--radius-sm); font-size: 14px; font-weight: 700; color: var(--primary); display: flex; align-items: center; min-width: 72px; justify-content: center; }
        .phone-input-wrapper .form-input { border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }
        .amount-display { text-align: center; padding: 20px; background: var(--primary-light); border-radius: var(--radius-sm); margin-bottom: 16px; }
        .amount-label { font-size: 12px; color: var(--text-light); text-transform: uppercase; letter-spacing: 1px; font-weight: 600; margin-bottom: 4px; }
        .amount-value { font-size: 32px; font-weight: 800; color: var(--primary); }
        .amount-value span { font-size: 18px; font-weight: 600; }
        .quick-amounts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 16px; }
        .quick-btn { padding: 12px 8px; border: 2px solid #e8ecf0; border-radius: var(--radius-sm); background: var(--white); font-size: 13px; font-weight: 700; color: var(--text); cursor: pointer; transition: all 0.2s ease; text-align: center; }
        .quick-btn:hover, .quick-btn.selected { border-color: var(--primary); background: var(--primary-light); color: var(--primary); }
        .period-options { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .period-btn { padding: 14px 10px; border: 2px solid #e8ecf0; border-radius: var(--radius-sm); background: var(--white); font-size: 14px; font-weight: 700; color: var(--text); cursor: pointer; transition: all 0.2s ease; text-align: center; }
        .period-btn small { display: block; font-size: 11px; color: var(--text-light); font-weight: 500; margin-top: 2px; }
        .period-btn:hover, .period-btn.selected { border-color: var(--primary); background: var(--primary-light); color: var(--primary); }
        .btn { width: 100%; padding: 16px; border: none; border-radius: var(--radius-sm); font-size: 16px; font-weight: 700; font-family: inherit; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-primary { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: var(--white); box-shadow: 0 4px 15px rgba(26,122,76,0.3); }
        .btn-primary:hover { transform: translateY(-2px); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .btn-outline { background: var(--white); color: var(--primary); border: 2px solid var(--primary); }
        .btn-outline:hover { background: var(--primary-light); }
        .pin-section { text-align: center; padding: 20px 0; }
        .pin-icon { width: 80px; height: 80px; background: var(--primary-light); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 36px; }
        .pin-input-wrapper { display: flex; justify-content: center; gap: 12px; margin: 24px 0; }
        .pin-dot { width: 16px; height: 16px; border-radius: 50%; border: 3px solid #d0d5dd; transition: all 0.2s ease; }
        .pin-dot.filled { background: var(--primary); border-color: var(--primary); }
        .pin-input { width: 100%; max-width: 280px; padding: 16px; border: 2px solid #e8ecf0; border-radius: var(--radius-sm); font-size: 24px; font-family: inherit; text-align: center; letter-spacing: 10px; outline: none; transition: all 0.3s ease; -webkit-text-security: disc; }
        .pin-input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(26,122,76,0.1); }
        .pin-hint { font-size: 12px; color: var(--text-light); margin-top: 12px; }
        .otp-section { text-align: center; padding: 20px 0; }
        .otp-icon { width: 80px; height: 80px; background: var(--primary-light); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 36px; animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        .otp-input { width: 100%; max-width: 280px; padding: 16px; border: 2px solid #e8ecf0; border-radius: var(--radius-sm); font-size: 28px; font-family: inherit; text-align: center; letter-spacing: 8px; outline: none; transition: all 0.3s ease; inputmode: numeric; }
        .otp-input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(26,122,76,0.1); }
        .otp-input:read-only { background: #f0f0f0; }
        .otp-status { margin-top: 16px; padding: 12px 16px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; display: none; }
        .otp-status.listening { display: block; background: #fff3e0; color: #e65100; }
        .otp-status.success { display: block; background: #e8f5e9; color: #2e7d32; }
        .otp-status.error { display: block; background: #ffebee; color: #c62828; }
        .otp-status.waiting { display: block; background: #e3f2fd; color: #1565c0; }
        .summary-card { background: var(--primary-light); border-radius: var(--radius-sm); padding: 16px; margin-bottom: 20px; }
        .summary-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; font-size: 14px; }
        .summary-row:not(:last-child) { border-bottom: 1px solid rgba(26,122,76,0.1); }
        .summary-label { color: var(--text-light); font-weight: 500; }
        .summary-value { font-weight: 700; color: var(--text); }
        .success-section { text-align: center; padding: 40px 20px; }
        .success-icon { width: 100px; height: 100px; background: #e8f5e9; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; font-size: 48px; animation: successBounce 0.6s cubic-bezier(0.68,-0.55,0.265,1.55); }
        @keyframes successBounce { 0% { transform: scale(0); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }
        .success-title { font-size: 24px; font-weight: 800; color: var(--success); margin-bottom: 8px; }
        .success-message { font-size: 14px; color: var(--text-light); line-height: 1.6; margin-bottom: 24px; }
        .waiting-section { text-align: center; padding: 40px 20px; }
        .waiting-icon { width: 100px; height: 100px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; font-size: 48px; animation: pulse 2s infinite; }
        .waiting-icon.blue { background: #e3f2fd; }
        .waiting-icon.green { background: #e8f5e9; }
        .waiting-title { font-size: 22px; font-weight: 800; margin-bottom: 8px; }
        .waiting-title.blue { color: #1565c0; }
        .waiting-title.green { color: #2e7d32; }
        .waiting-message { font-size: 14px; color: var(--text-light); line-height: 1.6; margin-bottom: 24px; }
        .waiting-spinner { width: 40px; height: 40px; border: 4px solid #e0e0e0; border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .spinner { width: 20px; height: 20px; border: 3px solid rgba(255,255,255,0.3); border-top-color: var(--white); border-radius: 50%; animation: spin 0.8s linear infinite; display: none; }
        .btn.loading .spinner { display: block; }
        .btn.loading .btn-text { display: none; }
